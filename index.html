<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>DinePro Owner — Restaurant Management</title>
    <meta
      name="description"
      content="Executive mobile owner app for restaurant chains: live KPIs, analytics and AI insights."
    />
    <meta property="og:title" content="DinePro Owner — Restaurant Management" />
    <meta
      property="og:description"
      content="Premium executive dashboard, reports and settings for restaurant owners."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0d1017" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    
    <script>
      try {
        var t = localStorage.getItem('dinepro-theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
